      <stop offset="0.48" stop-color="#a8ff3e" stop-opacity="0.84"/>
      <stop offset="1" stop-color="#a8ff3e" stop-opacity="0"/>
    </linearGradient>
    <filter id="softBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="lineGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.08"/>
      </feComponentTransfer>
    </filter>
    <mask id="fadeTop">
      <linearGradient id="fadeGradient" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0" stop-color="white" stop-opacity="0.2"/>
        <stop offset="0.26" stop-color="white" stop-opacity="1"/>
        <stop offset="1" stop-color="white" stop-opacity="1"/>
      </linearGradient>
      <rect width="1920" height="1080" fill="url(#fadeGradient)"/>
    </mask>
    <pattern id="windowGrid" width="42" height="46" patternUnits="userSpaceOnUse">
