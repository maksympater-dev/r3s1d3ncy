<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>R3 Signal Bypass CRT Prototype</title>
    <base href="/r3-signal-bypass/" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="crt-shell" aria-label="R3 Signal Bypass CRT prototype">
      <canvas id="gameCanvas" aria-label="Power calibration puzzle"></canvas>
      <div class="crt-overlay" aria-hidden="true"></div>
      <div class="crt-vignette" aria-hidden="true"></div>
      <section class="hud" aria-label="Game controls">
        <span>A / D Select</span>
        <span>Space Confirm</span>
        <span>Click Rotate</span>
      </section>
      <div id="boot" class="boot">INITIALIZING R3 POWER TERMINAL...</div>
    </main>
    <script src="./game.js" type="module"></script>
  </body>
</html>
